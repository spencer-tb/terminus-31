[project]
name = "terminus-31"
version = "0.0.1"
description = "Agent-first operational workspace for Ethereum execution layer testing."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Spencer Taylor-Brown" }]
dependencies = []

[project.scripts]
terminus-31 = "terminus_31.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/terminus_31"]
